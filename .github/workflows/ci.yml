name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install Lua (for generated-config syntax checks)
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          sudo ln -sf "$(command -v luac5.4)" /usr/local/bin/luac

      - name: Unit + config-syntax tests
        run: node --test tests/model.test.js tests/manifest.test.js tests/lua.test.js

  # Layers 4-6 need a live Hyprland + omarchy-shell (+ wtype for the panel
  # e2e) and cannot run in CI. Run them on your desktop:
  #   npm run test:contract     # tests/hypr-contract.test.js
  #   bash tests/smoke.sh       # plugin loads + panel opens, no QML error
  #   bash tests/e2e.sh         # synthetic keystrokes -> real side effects
  #   bash scripts/check.sh     # all six, in order
  # See docs/TESTING.md.

  qmllint:
    runs-on: ubuntu-latest
    continue-on-error: true   # informational: qs.* imports never resolve here
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y qml6-module-qtquick qt6-declarative-dev-tools || \
          sudo apt-get install -y qt6-tools-dev-tools
      - name: Lint QML (best effort)
        run: |
          QL="$(command -v qmllint6 || command -v qmllint || echo /usr/lib/qt6/bin/qmllint)"
          "$QL" ./*.qml || true
